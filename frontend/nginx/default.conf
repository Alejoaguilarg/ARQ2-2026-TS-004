# Serves the web app and forwards /api/* to the API Gateway, so the browser talks to one origin (no CORS).
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    # The Gateway rejects bigger bodies anyway (PAYLOAD_TOO_LARGE, 16 KB); stop them here.
    client_max_body_size 16k;

    # Docker's DNS, re-asked every 10 s: the Gateway keeps working after it is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The Gateway's actuator is for Prometheus inside the network, not for browsers.
    location ^~ /api/actuator {
        return 404;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $gateway http://api-gateway:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The Gateway trusts this header only from this container (TRUSTED_PROXIES), for the per-IP limits.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html, never cached so a new deploy shows at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
