name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Line coverage per service, all modules together except applications/app-service.
  MIN_COVERAGE: 90

permissions:
  contents: read
  pull-requests: read

jobs:
  # Which services changed. Each one is its own Gradle project, so only those are built.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      frontend: ${{ steps.web.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # Editing the CI rebuilds every service, so a CI change is tested against all of them.
          filters: |
            api-gateway: [services/api-gateway/**, .github/workflows/ci.yml, .github/scripts/**]
            identity-service: [services/identity-service/**, .github/workflows/ci.yml, .github/scripts/**]
            wallet-service: [services/wallet-service/**, .github/workflows/ci.yml, .github/scripts/**]
            transfer-service: [services/transfer-service/**, .github/workflows/ci.yml, .github/scripts/**]
            audit-service: [services/audit-service/**, .github/workflows/ci.yml, .github/scripts/**]
            notification-service: [services/notification-service/**, .github/workflows/ci.yml, .github/scripts/**]
      # The web app is not a Gradle service, so it has its own filter and job.
      - id: web
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend: [frontend/**, .github/workflows/ci.yml]

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    name: build (${{ matrix.service }})
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      # A filter can match a service that is not on this branch yet (only the workflow changed).
      - id: exists
        working-directory: .
        run: echo "present=$([ -f services/${{ matrix.service }}/gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: steps.exists.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
      # Unit tests plus *IntegrationTest with Testcontainers (Docker is available on the runner).
      - if: steps.exists.outputs.present == 'true'
        run: ./gradlew build --no-daemon
      - if: steps.exists.outputs.present == 'true'
        name: Line coverage >= ${{ env.MIN_COVERAGE }}%
        working-directory: .
        run: python3 .github/scripts/coverage.py services/${{ matrix.service }} "$MIN_COVERAGE"
      - if: failure() && steps.exists.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/**/build/reports/
          retention-days: 7

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Type check + production build, then the tests with line coverage >= 90% (vite.config.ts).
      - run: npm run build
      - run: npm run coverage
      - name: The nginx config is valid
        run: docker run --rm -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" -v "$PWD/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" --add-host api-gateway:127.0.0.1 nginx:1.27-alpine nginx -t

  # The one check to require in branch protection: the build matrix only exists for the services a
  # PR touches, so requiring "build (x)" would block every PR that does not change x.
  ci-ok:
    if: always()
    needs: [changes, build, frontend, infra]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed"

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose is valid
        run: |
          docker compose config -q
          docker compose --profile apps config -q
      # Same image as docker-compose, so CI checks with the promtool of the Prometheus that runs the rules.
      - name: Prometheus config and alert rules
        working-directory: infra/observability/prometheus
        run: |
          promtool() { docker run --rm -v "$PWD":/w -w /w --entrypoint promtool prom/prometheus:v3.5.0 "$@"; }
          promtool check config prometheus.yml
          if [ -f alerts.test.yml ]; then promtool test rules alerts.test.yml; fi
      - name: JSON files parse (RabbitMQ topology, Grafana dashboards, Postman collections)
        run: |
          status=0
          for f in $(git ls-files '*.json'); do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; status=1; }
          done
          exit $status
