# Finova P2P Virtual Wallet
#
# Docker Compose uses PostgreSQL and Redis locally.
# RabbitMQ is provided externally by CloudAMQP.
#
# Start Audit Service:
#   docker compose up -d --build audit-service
#
# Start the complete system:
#   docker compose --profile apps up -d --build

name: finova

x-app: &app
  profiles: ["apps"]
  restart: unless-stopped
  networks: [backend]

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: docker

  # Redis
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"

  # RabbitMQ / CloudAMQP
  # Values come from the root .env file.
  SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
  SPRING_RABBITMQ_PORT: "${RABBITMQ_PORT:-5671}"
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST}
  SPRING_RABBITMQ_SSL_ENABLED: "${RABBITMQ_SSL_ENABLED:-true}"

  # PostgreSQL
  SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
  SPRING_JPA_DATABASEPLATFORM: org.hibernate.dialect.PostgreSQLDialect

  # Actuator / Prometheus
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus

  # OpenTelemetry
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://alloy:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"

  JAVA_OPTS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=70

x-app-healthcheck: &app-healthcheck
  test:
    [
      "CMD-SHELL",
      "wget -qO- http://localhost:8080/actuator/health | grep -q UP"
    ]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [backend]

  healthcheck:
    test:
      [
        "CMD-SHELL",
        "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      ]
    interval: 5s
    timeout: 5s
    retries: 10

services:

  # ================================================================
  # EDGE
  # ================================================================

  api-gateway:
    <<: *app

    build:
      context: ./services/api-gateway
      dockerfile: deployment/Dockerfile

    ports:
      - "${GATEWAY_PORT:-8080}:8080"

    environment:
      <<: *app-env

      IDENTITY_SERVICE_URI: http://identity-service:8080
      WALLET_SERVICE_URI: http://wallet-service:8080
      TRANSFER_SERVICE_URI: http://transfer-service:8080
      AUDIT_SERVICE_URI: http://audit-service:8080
      JWKS_URI: http://identity-service:8080/.well-known/jwks.json

    healthcheck: *app-healthcheck

    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      transfer-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy

  # ================================================================
  # APPLICATION SERVICES
  # ================================================================

  identity-service:
    <<: *app

    build:
      context: ./services/identity-service
      dockerfile: deployment/Dockerfile

    environment:
      <<: *app-env

      SPRING_DATASOURCE_URL: jdbc:postgresql://identity-db:5432/identity_db
      SPRING_DATASOURCE_USERNAME: ${IDENTITY_DB_USER:-identity}
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}

    healthcheck: *app-healthcheck

    depends_on:
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  wallet-service:
    <<: *app

    build:
      context: ./services/wallet-service
      dockerfile: deployment/Dockerfile

    environment:
      <<: *app-env

      SPRING_DATASOURCE_URL: jdbc:postgresql://wallet-db:5432/wallet_db
      SPRING_DATASOURCE_USERNAME: ${WALLET_DB_USER:-wallet}
      SPRING_DATASOURCE_PASSWORD: ${WALLET_DB_PASSWORD:-wallet}

    healthcheck: *app-healthcheck

    depends_on:
      wallet-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  transfer-service:
    <<: *app

    build:
      context: ./services/transfer-service
      dockerfile: deployment/Dockerfile

    environment:
      <<: *app-env

      SPRING_DATASOURCE_URL: jdbc:postgresql://transfer-db:5432/transfer_db
      SPRING_DATASOURCE_USERNAME: ${TRANSFER_DB_USER:-transfer}
      SPRING_DATASOURCE_PASSWORD: ${TRANSFER_DB_PASSWORD:-transfer}

    healthcheck: *app-healthcheck

    depends_on:
      transfer-db:
        condition: service_healthy

  audit-service:
    <<: *app

    build:
      context: ./services/audit-service
      dockerfile: deployment/Dockerfile

    environment:
      <<: *app-env

      # Audit PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://audit-db:5432/audit_db
      SPRING_DATASOURCE_USERNAME: ${AUDIT_DB_USER:-audit}
      SPRING_DATASOURCE_PASSWORD: ${AUDIT_DB_PASSWORD:-audit}

      # Audit RabbitMQ queues
      AUDIT_QUEUE: ${AUDIT_QUEUE:-audit.attempts.q}
      AUDIT_RETRY_QUEUE: ${AUDIT_RETRY_QUEUE:-audit.attempts.q.retry}
      AUDIT_DLQ: ${AUDIT_DLQ:-audit.attempts.q.dlq}

    healthcheck: *app-healthcheck

    depends_on:
      audit-db:
        condition: service_healthy

  notification-service:
    <<: *app

    build:
      context: ./services/notification-service
      dockerfile: deployment/Dockerfile

    environment:
      <<: *app-env

      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USER:-notification}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification}

      NOTIFICATION_PROVIDER_URI: http://notification-provider-mock:8080

    healthcheck: *app-healthcheck

    depends_on:
      notification-db:
        condition: service_healthy
      notification-provider-mock:
        condition: service_started

  # ================================================================
  # DATABASES
  # ================================================================

  identity-db:
    <<: *postgres

    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}

    volumes:
      - identity-db-data:/var/lib/postgresql/data

  wallet-db:
    <<: *postgres

    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: ${WALLET_DB_USER:-wallet}
      POSTGRES_PASSWORD: ${WALLET_DB_PASSWORD:-wallet}

    volumes:
      - wallet-db-data:/var/lib/postgresql/data

  transfer-db:
    <<: *postgres

    environment:
      POSTGRES_DB: transfer_db
      POSTGRES_USER: ${TRANSFER_DB_USER:-transfer}
      POSTGRES_PASSWORD: ${TRANSFER_DB_PASSWORD:-transfer}

    volumes:
      - transfer-db-data:/var/lib/postgresql/data

  audit-db:
    <<: *postgres

    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: ${AUDIT_DB_USER:-audit}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-audit}

    volumes:
      - audit-db-data:/var/lib/postgresql/data

  notification-db:
    <<: *postgres

    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification}

    volumes:
      - notification-db-data:/var/lib/postgresql/data

  # ================================================================
  # REDIS
  # ================================================================

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec"
      ]

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ================================================================
  # EXTERNAL SYSTEM MOCK
  # ================================================================

  notification-provider-mock:
    image: wiremock/wiremock:3.13.1
    restart: unless-stopped
    networks: [backend]

    volumes:
      - ./infra/notification-provider-mock/mappings:/home/wiremock/mappings:ro

  # ================================================================
  # OBSERVABILITY
  # ================================================================

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    networks: [backend]

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    networks: [backend]

    command:
      - -config.file=/etc/loki/local-config.yaml

    volumes:
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    networks: [backend]

    user: root

    command:
      - -config.file=/etc/tempo/tempo.yml

    volumes:
      - ./infra/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  alloy:
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    networks: [backend]

    command:
      [
        "run",
        "/etc/alloy/config.alloy",
        "--storage.path=/var/lib/alloy/data"
      ]

    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - loki
      - tempo

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    networks: [backend]

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus
      - loki
      - tempo

networks:
  backend:

volumes:
  identity-db-data:
  wallet-db-data:
  transfer-db-data:
  audit-db-data:
  notification-db-data:
  redis-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data: