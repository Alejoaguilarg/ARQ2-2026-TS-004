global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: finova-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - identity-service:8080
          - wallet-service:8080
          - transfer-service:8080
          - audit-service:8080
          - notification-service:8080

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
