apply plugin: 'org.springframework.boot'

dependencies {
	implementation project(':saga-sweeper')
	implementation project(':outbox-relay')
	implementation project(':rabbitmq-consumer')
	implementation project(':message-json')
	implementation project(':rabbitmq-publisher')
	implementation project(':jpa-repository')
	testImplementation 'org.springframework:spring-web'
	testImplementation 'org.springframework:spring-jdbc'
	implementation project(':api-rest')
    implementation project(':model')
    // Traces to Tempo through Alloy (MANAGEMENT_OTLP_TRACING_ENDPOINT in docker-compose); nothing is sent without it.
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation project(':usecase')
    implementation 'org.springframework.boot:spring-boot-starter'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'com.tngtech.archunit:archunit:1.3.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    // Local RabbitMQ with infra/rabbitmq/definitions.json; never a shared broker.
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.springframework.boot:spring-boot-starter-amqp'
}

tasks.register('explodedJar', Copy) {
    with jar
    into layout.buildDirectory.dir("exploded")
}

jar {
    // To disable the *-plain.jar
    enabled = false
}

bootJar {
    // Sets output jar name
    archiveFileName = "${project.getParent().getName()}.${archiveExtension.get()}"
}
