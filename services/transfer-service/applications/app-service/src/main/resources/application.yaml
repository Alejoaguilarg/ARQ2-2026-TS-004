server:
  port: 8080
spring:
  application:
    name: "transfer-service"
  devtools:
    add-properties: false
  # Datasource and RabbitMQ connection (host, port, vhost, credentials, TLS) come only from environment
  # variables: SPRING_DATASOURCE_*, SPRING_RABBITMQ_*. A cloud broker goes in a local .env (see .env.example).
  datasource:
    url: "jdbc:postgresql://localhost:5432/transfer_db"
    username: "transfer"
    password: "transfer"
  rabbitmq:
    # No RabbitAdmin: the service never declares queues, exchanges or bindings.
    dynamic: false
    publisher-confirm-type: "correlated"
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Spec §4.2: manual acks; a rejected delivery is never requeued, so the queue dead-letters it to its
        # .retry queue (5 s) and it comes back. The listener only consumes the existing queue.
        acknowledge-mode: "manual"
        default-requeue-rejected: false
        missing-queues-fatal: true
        prefetch: 10
logging:
  pattern:
    # Spec §1.4: correlationId and transferId in every log line, from the MDC (CorrelationIdFilter for HTTP,
    # MessageLogContext for messages); the trace ids link a line to its trace. Empty brackets when absent.
    correlation: "[%X{correlationId:-}] [%X{transferId:-}] [%X{traceId:-},%X{spanId:-}] "
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
adapters:
  rabbitmq:
    confirm-timeout: "5s"
    # Spec §4.5: 3 retries after the first delivery (4 deliveries), then the .dlq.
    max-retries: 3
  outbox:
    # One batch every 100 ms, as in Wallet (ADR 002 targets a saga under 1 s, ~4 relay hops per transfer).
    relay-enabled: true
    relay-interval: "100ms"
    batch-size: 100
