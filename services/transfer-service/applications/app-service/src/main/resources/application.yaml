server:
  port: 8080
spring:
  application:
    name: "transfer-service"
  devtools:
    add-properties: false
  # Datasource and RabbitMQ connection (host, port, vhost, credentials, TLS) come only from environment
  # variables: SPRING_DATASOURCE_*, SPRING_RABBITMQ_*. A cloud broker goes in a local .env (see .env.example).
  datasource:
    url: "jdbc:postgresql://localhost:5432/transfer_db"
    username: "transfer"
    password: "transfer"
  rabbitmq:
    # No RabbitAdmin: the service never declares queues, exchanges or bindings.
    dynamic: false
    publisher-confirm-type: "correlated"
    publisher-returns: true
    template:
      mandatory: true
      # W3C trace context (traceparent) in the AMQP headers of every published message, never in the §4.1
      # envelope, as in Wallet. Override with SPRING_RABBITMQ_TEMPLATE_OBSERVATION_ENABLED.
      observation-enabled: true
    listener:
      simple:
        # The listener continues the trace of an incoming message that carries traceparent.
        # Override with SPRING_RABBITMQ_LISTENER_SIMPLE_OBSERVATION_ENABLED.
        observation-enabled: true
        # Spec §4.2: manual acks; a rejected delivery is never requeued, so the queue dead-letters it to its
        # .retry queue (5 s) and it comes back. The listener only consumes the existing queue.
        acknowledge-mode: "manual"
        default-requeue-rejected: false
        missing-queues-fatal: true
        prefetch: 10
logging:
  pattern:
    # Spec §1.4: correlationId and transferId in every log line, from the MDC (CorrelationIdFilter for HTTP,
    # MessageLogContext for messages); the trace ids link a line to its trace. Empty brackets when absent.
    correlation: "[%X{correlationId:-}] [%X{transferId:-}] [%X{traceId:-},%X{spanId:-}] "
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    enable:
      # The outbox relay runs every 100 ms and the sweeper every 2 s: one trace per run would bury the real ones,
      # and every message the relay publishes would hang from a span Alloy drops (as in Wallet).
      "[tasks.scheduled.execution]": false
adapters:
  rabbitmq:
    confirm-timeout: "5s"
    # Spec §4.5: 3 retries after the first delivery (4 deliveries), then the .dlq.
    max-retries: 3
  outbox:
    # One batch every 100 ms, as in Wallet (ADR 002 targets a saga under 1 s, ~4 relay hops per transfer).
    relay-enabled: true
    relay-interval: "100ms"
    batch-size: 100
    # Audit finding H1: a row that fails waits retry-initial-delay, doubled after each failure up to retry-max-delay,
    # and is never dropped. Override with ADAPTERS_OUTBOX_RETRY_INITIAL_DELAY and ADAPTERS_OUTBOX_RETRY_MAX_DELAY.
    retry-initial-delay: "1s"
    retry-max-delay: "5m"
  saga:
    # Spec §4.6 rule 8: the timeout sweeper runs every 2 s. Timeouts: 30 s for a PENDING DebitWallet, 10 s for each
    # CreditWallet attempt (3 attempts), 30 s between ReverseDebit resends.
    sweeper-enabled: true
    sweep-interval: "2s"
    sweep-batch-size: 100
    pending-timeout: "30s"
    credit-timeout: "10s"
    reverse-resend: "30s"
