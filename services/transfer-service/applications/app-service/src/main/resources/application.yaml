server:
  port: 8080
spring:
  application:
    name: "transfer-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  datasource:
    url: "jdbc:h2:mem:test"
    username: "sa"
    password: "pass"
    driverClassName: "org.h2.Driver"
  jpa:
    databasePlatform: "org.hibernate.dialect.H2Dialect"
  data:
    redis:
      host: "localhost"
      port: 6379
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"
    publisher-confirm-type: "correlated"
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  rabbitmq:
    confirm-timeout: "5s"
