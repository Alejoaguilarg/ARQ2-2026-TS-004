package=co.com.finova.transfer
systemProp.version=3.20.11
reactive=false
lombok=true
metrics=true
language=java
org.gradle.parallel=true
# Docker Desktop cannot start the Testcontainers of every module at once (PostgreSQL, Redis, RabbitMQ):
# at most 2 Gradle workers keeps the build parallel but stable.
org.gradle.workers.max=2
systemProp.sonar.gradle.skipCompile=true
