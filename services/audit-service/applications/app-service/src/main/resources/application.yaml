server:
  port: 8080

spring:
  application:
    name: "audit-service"

  devtools:
    add-properties: false

  datasource:
    url: "jdbc:postgresql://localhost:5432/audit_db"
    username: "audit"
    password: "audit"
    hikari:
      connection-init-sql: "SET ROLE audit_rw"

  flyway:
    enabled: true
    locations: "classpath:db/migration"
    user: "${spring.datasource.username}"
    password: "${spring.datasource.password}"

  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: ${RABBITMQ_PORT:5672}
    username: "${RABBITMQ_USERNAME:guest}"
    password: "${RABBITMQ_PASSWORD:guest}"
    virtual-host: "${RABBITMQ_VHOST:/}"

    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}

    # Queues/exchanges already exist in RabbitMQ.
    dynamic: false

    publisher-confirm-type: "correlated"
    publisher-returns: true

    template:
      mandatory: true

    listener:
      simple:
        acknowledge-mode: "manual"
        concurrency: 1
        max-concurrency: 1
        prefetch: 20
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"

  endpoint:
    health:
      probes:
        enabled: true

adapters:
  rabbitmq:
    # Audit queues already provisioned in RabbitMQ.
    audit-queue: "${AUDIT_QUEUE:audit.attempts.q}"
    audit-retry-queue: "${AUDIT_RETRY_QUEUE:audit.attempts.q.retry}"
    audit-dlq: "${AUDIT_DLQ:audit.attempts.q.dlq}"

    confirm-timeout: "5s"

    # Spec: 5 retries before sending the message to the DLQ.
    audit-retry-limit: 5

  audit:
    partitions:
      initial-delay: "PT30S"
      check-interval: "PT6H"
logging:
  pattern:
    # Spec §1.4: correlationId and transferId in every log line, from the MDC (CorrelationIdFilter for HTTP,
    # AttemptRecordedListener for messages); the trace ids link a line to its trace. Empty brackets when absent.
    correlation: "[%X{correlationId:-}] [%X{transferId:-}] [%X{traceId:-},%X{spanId:-}] "
