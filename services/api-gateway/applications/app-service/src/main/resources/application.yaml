server:
  port: 8080
spring:
  http:
    client:
      # Proxy client to the services. Without a read timeout a hung service holds the request forever;
      # past it the Gateway answers 504 UPSTREAM_UNAVAILABLE (spec.md §3.1 step 5). Refused: 502.
      connect-timeout: ${UPSTREAM_CONNECT_TIMEOUT:2s}
      read-timeout: ${UPSTREAM_READ_TIMEOUT:10s}
  application:
    name: api-gateway
  devtools:
    add-properties: false
  data:
    redis:
      host: "localhost"
      port: 6379
      # Fail fast so the Gateway can answer 503 (fail closed) instead of hanging on a dead Redis.
      timeout: "500ms"
      connect-timeout: "500ms"
  rabbitmq:
    # Publishes AttemptRecorded to audit.events (spec.md §3.1 step 6); the broker owns the topology.
    dynamic: false
    # A dead broker must fail the publish fast so the audit retries do not pile up (default is 60 s).
    connection-timeout: "2s"
    publisher-confirm-type: "correlated"
    publisher-returns: true
    template:
      mandatory: true
  cloud:
    gateway:
      mvc:
        routes:
          # spec.md §3.1.3: exactly the 10 public endpoints, by method and path. Anything else, including other
          # endpoints of the same services, answers 404 instead of reaching them. AuthenticationFilter strips
          # client-sent X-User-Id, X-Device-Id and X-User-Roles and injects the verified ones (§3.1 step 5), so
          # routes need no header filters.
          - id: identity
            uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
            predicates:
              - Method=POST
              - Path=/auth/login,/auth/refresh,/auth/logout,/auth/financial-session
          - id: identity-users
            uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
            predicates:
              - Method=POST
              - Path=/users/lookup
          - id: wallet
            uri: ${WALLET_SERVICE_URI:http://localhost:8082}
            predicates:
              - Method=GET
              - Path=/wallets/me/balance
          - id: transfer-create
            uri: ${TRANSFER_SERVICE_URI:http://localhost:8083}
            predicates:
              - Method=POST
              - Path=/transfers
          - id: transfer-status
            uri: ${TRANSFER_SERVICE_URI:http://localhost:8083}
            predicates:
              - Method=GET
              - Path=/transfers/{transferId}
          - id: audit
            uri: ${AUDIT_SERVICE_URI:http://localhost:8084}
            predicates:
              - Method=GET
              - Path=/audit/records,/audit/verify
finova:
  security:
    # Identity's internal JWKS endpoint (spec.md §3.1.3) and the iss of its tokens.
    jwks-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:finova-identity}
management:
  server:
    # spec.md §1.4: only the Gateway's API is exposed. Health and metrics answer on their own port, which
    # docker-compose does not publish: the healthcheck and Prometheus reach it inside the network only.
    port: ${MANAGEMENT_SERVER_PORT:9090}
  health:
    rabbit:
      # The audit is never in the critical path: a down broker must not take the Gateway out of service.
      enabled: false
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
logging:
  pattern:
    # spec.md §1: the correlationId goes in every log line, so a request can be found in Loki by its id.
    # CorrelationIdFilter puts it in the MDC; the id is the X-Correlation-Id the client got back.
    # [correlationId] [traceId,spanId]: the second part links a log line to its trace in Tempo (Grafana Loki
    # derived field in infra/observability/grafana/provisioning/datasources/datasources.yml).
    correlation: "[%X{correlationId:-}] [%X{traceId:-},%X{spanId:-}] "
