server:
  port: 8080
spring:
  http:
    client:
      # Proxy client to the services. Without a read timeout a hung service holds the request forever;
      # past it the Gateway answers 504 UPSTREAM_UNAVAILABLE (spec.md §3.1 step 5). Refused: 502.
      connect-timeout: ${UPSTREAM_CONNECT_TIMEOUT:2s}
      read-timeout: ${UPSTREAM_READ_TIMEOUT:10s}
  application:
    name: api-gateway
  devtools:
    add-properties: false
  data:
    redis:
      host: "localhost"
      port: 6379
      # Fail fast so the Gateway can answer 503 (fail closed) instead of hanging on a dead Redis.
      timeout: "500ms"
      connect-timeout: "500ms"
  cloud:
    gateway:
      mvc:
        routes:
          # spec.md §3.1.3. AuthenticationFilter strips client-sent X-User-Id, X-Device-Id and
          # X-User-Roles and injects the verified ones (§3.1 step 5), so routes need no header filters.
          - id: identity
            uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
            predicates:
              - Path=/auth/**
          - id: wallet
            uri: ${WALLET_SERVICE_URI:http://localhost:8082}
            predicates:
              - Path=/wallets/**
          - id: transfer
            uri: ${TRANSFER_SERVICE_URI:http://localhost:8083}
            predicates:
              - Path=/transfers/**
          - id: audit
            uri: ${AUDIT_SERVICE_URI:http://localhost:8084}
            predicates:
              - Path=/audit/**
finova:
  security:
    # Identity's internal JWKS endpoint (spec.md §3.1.3) and the iss of its tokens.
    jwks-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:finova-identity}
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
logging:
  pattern:
    # spec.md §1: the correlationId goes in every log line, so a request can be found in Loki by its id.
    # CorrelationIdFilter puts it in the MDC; the id is the X-Correlation-Id the client got back.
    correlation: "[%X{correlationId:-}] "
