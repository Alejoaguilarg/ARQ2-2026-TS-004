server:
  port: 8080
spring:
  application:
    name: "wallet-service"
  devtools:
    add-properties: false
  # Datasource and RabbitMQ connection (host, port, vhost, credentials, TLS) come only from
  # environment variables: SPRING_DATASOURCE_*, SPRING_RABBITMQ_*.
  jpa:
    # Flyway owns the schema (db/migration); Hibernate only checks it.
    hibernate:
      ddl-auto: "validate"
    open-in-view: false
  data:
    redis:
      host: "localhost"
      port: 6379
  rabbitmq:
    # No RabbitAdmin: the service never declares queues, exchanges or bindings.
    dynamic: false
    publisher-confirm-type: "correlated"
    publisher-returns: true
    template:
      mandatory: true
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
adapters:
  rabbitmq:
    confirm-timeout: "5s"
