apply plugin: 'org.springframework.boot'

dependencies {
	implementation project(':balance-rebuild')
	implementation project(':outbox-relay')
	implementation project(':rabbitmq-consumer')
	implementation project(':message-json')
	implementation project(':rabbitmq-publisher')
	implementation project(':redis')
	implementation project(':jpa-repository')
	testImplementation 'org.springframework:spring-web'
	testImplementation 'org.springframework:spring-jdbc'
	testImplementation 'org.springframework.data:spring-data-redis'
	implementation project(':api-rest')
    implementation project(':model')
    implementation project(':usecase')
    implementation 'org.springframework.boot:spring-boot-starter'
    // Traces to Tempo through Alloy (docs/observability.md): the endpoint and the sampling come from x-app-env
    // (MANAGEMENT_OTLP_TRACING_ENDPOINT, MANAGEMENT_TRACING_SAMPLING_PROBABILITY); MANAGEMENT_TRACING_ENABLED=false
    // turns them off.
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'com.tngtech.archunit:archunit:1.3.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    // Local RabbitMQ with infra/rabbitmq/definitions.json; never the shared account.
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.springframework.boot:spring-boot-starter-amqp'
}

tasks.register('explodedJar', Copy) {
    with jar
    into layout.buildDirectory.dir("exploded")
}

jar {
    // To disable the *-plain.jar
    enabled = false
}

bootJar {
    // Sets output jar name
    archiveFileName = "${project.getParent().getName()}.${archiveExtension.get()}"
}